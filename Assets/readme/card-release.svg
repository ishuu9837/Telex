<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="22" y="22" width="304" height="184" rx="12" fill="#090F1C" stroke="#233552"/><text x="39" y="52" font-size="10" fill="#60A5FA" font-weight="700" letter-spacing="1">RECORDED VERIFICATION</text><text x="39" y="87" font-size="18" fill="#F8FAFC" font-weight="700" >54 tests passed</text><text x="39" y="122" font-size="13" fill="#A5B4CC" font-weight="400" >Native Xcode and Swift package runs.</text><text x="39" y="147" font-size="13" fill="#A5B4CC" font-weight="400" >Xcode analysis and scoped static checks.</text><text x="39" y="172" font-size="13" fill="#A5B4CC" font-weight="400" >These are not security certification.</text><rect x="348" y="22" width="304" height="184" rx="12" fill="#090F1C" stroke="#233552"/><text x="365" y="52" font-size="10" fill="#60A5FA" font-weight="700" letter-spacing="1">DEVELOPMENT PRERELEASE</text><text x="365" y="87" font-size="18" fill="#F8FAFC" font-weight="700" >Not notarized yet</text><text x="365" y="122" font-size="13" fill="#A5B4CC" font-weight="400" >v1.0.0-dev.1 is ad-hoc signed.</text><text x="365" y="147" font-size="13" fill="#A5B4CC" font-weight="400" >Gatekeeper may block opening the app.</text><text x="365" y="172" font-size="13" fill="#A5B4CC" font-weight="400" >Developer ID distribution is pending.</text><rect x="674" y="22" width="304" height="184" rx="12" fill="#090F1C" stroke="#233552"/><text x="691" y="52" font-size="10" fill="#60A5FA" font-weight="700" letter-spacing="1">QA STILL REQUIRED</text><text x="691" y="87" font-size="18" fill="#F8FAFC" font-weight="700" >Test the real workflows</text><text x="691" y="122" font-size="13" fill="#A5B4CC" font-weight="400" >Speech accuracy and capture-tool matrix.</text><text x="691" y="147" font-size="13" fill="#A5B4CC" font-weight="400" >Recording interruption recovery.</text><text x="691" y="172" font-size="13" fill="#A5B4CC" font-weight="400" >Full accessibility and performance review.</text></g></svg>
