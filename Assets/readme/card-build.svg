<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="228" viewBox="0 0 1000 228" role="img" aria-labelledby="title desc">
<title id="title">Apple silicon + Intel / Run and inspect the source / Build your own DMG</title><desc id="desc">Telex for macOS. Electric cobalt, deep carbon and studio white.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090D16"/><stop offset="1" stop-color="#101B30"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#0066FF" stop-opacity=".32"/><stop offset="1" stop-color="#0066FF" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="1" fill="#60A5FA" opacity=".1"/></pattern>
</defs>
<rect width="1000" height="228" rx="18" fill="url(#bg)"/>
<ellipse cx="160" cy="20" rx="450" ry="240" fill="url(#glow)"/>
<rect width="1000" height="228" rx="18" fill="url(#grid)"/>
<rect x="1" y="1" width="998" height="226" rx="17" fill="none" stroke="#315080" stroke-opacity=".6"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="22" y="22" width="304" height="184" rx="12" fill="#090F1C" stroke="#233552"/><text x="39" y="52" font-size="10" fill="#60A5FA" font-weight="700" letter-spacing="1">MACOS 14+</text><text x="39" y="87" font-size="18" fill="#F8FAFC" font-weight="700" >Apple silicon + Intel</text><text x="39" y="122" font-size="13" fill="#A5B4CC" font-weight="400" >Swift 6, SwiftUI and AppKit.</text><text x="39" y="147" font-size="13" fill="#A5B4CC" font-weight="400" >Apple frameworks; no external packages.</text><text x="39" y="172" font-size="13" fill="#A5B4CC" font-weight="400" >Native NSPanel hosts the prompter.</text><rect x="348" y="22" width="304" height="184" rx="12" fill="#090F1C" stroke="#233552"/><text x="365" y="52" font-size="10" fill="#60A5FA" font-weight="700" letter-spacing="1">XCODE WORKFLOW</text><text x="365" y="87" font-size="18" fill="#F8FAFC" font-weight="700" >Run and inspect the source</text><text x="365" y="122" font-size="13" fill="#A5B4CC" font-weight="400" >Open Telex.xcodeproj; choose Telex.</text><text x="365" y="147" font-size="13" fill="#A5B4CC" font-weight="400" >Command + R runs; Command + U tests.</text><text x="365" y="172" font-size="13" fill="#A5B4CC" font-weight="400" >Sources/Telex and Tests/TelexTests.</text><rect x="674" y="22" width="304" height="184" rx="12" fill="#090F1C" stroke="#233552"/><text x="691" y="52" font-size="10" fill="#60A5FA" font-weight="700" letter-spacing="1">UNIVERSAL PACKAGING</text><text x="691" y="87" font-size="18" fill="#F8FAFC" font-weight="700" >Build your own DMG</text><text x="691" y="122" font-size="13" fill="#A5B4CC" font-weight="400" >Scripts/build_universal_dmg.sh</text><text x="691" y="147" font-size="13" fill="#A5B4CC" font-weight="400" >Runs tests and builds both architectures.</text><text x="691" y="172" font-size="13" fill="#A5B4CC" font-weight="400" >Ad-hoc signing is the local default.</text></g></svg>
