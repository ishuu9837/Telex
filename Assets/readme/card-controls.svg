<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="228" viewBox="0 0 1000 228" role="img" aria-labelledby="title desc">
<title id="title">A pause when you need it / Always a way back / Honest microphone status</title><desc id="desc">Telex for macOS. Electric cobalt, deep carbon and studio white.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090D16"/><stop offset="1" stop-color="#101B30"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#0066FF" stop-opacity=".32"/><stop offset="1" stop-color="#0066FF" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="1" fill="#60A5FA" opacity=".1"/></pattern>
</defs>
<rect width="1000" height="228" rx="18" fill="url(#bg)"/>
<ellipse cx="160" cy="20" rx="450" ry="240" fill="url(#glow)"/>
<rect width="1000" height="228" rx="18" fill="url(#grid)"/>
<rect x="1" y="1" width="998" height="226" rx="17" fill="none" stroke="#315080" stroke-opacity=".6"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="22" y="22" width="304" height="184" rx="12" fill="#090F1C" stroke="#233552"/><text x="39" y="52" font-size="10" fill="#60A5FA" font-weight="700" letter-spacing="1">HOVER &amp; PAUSE</text><text x="39" y="87" font-size="18" fill="#F8FAFC" font-weight="700" >A pause when you need it</text><text x="39" y="122" font-size="13" fill="#A5B4CC" font-weight="400" >Hover to pause; leave to resume.</text><text x="39" y="147" font-size="13" fill="#A5B4CC" font-weight="400" >Click Pause to hold your place.</text><text x="39" y="172" font-size="13" fill="#A5B4CC" font-weight="400" >Scroll manually and jump between cues.</text><rect x="348" y="22" width="304" height="184" rx="12" fill="#090F1C" stroke="#233552"/><text x="365" y="52" font-size="10" fill="#60A5FA" font-weight="700" letter-spacing="1">KEYBOARD RECOVERY</text><text x="365" y="87" font-size="18" fill="#F8FAFC" font-weight="700" >Always a way back</text><text x="365" y="122" font-size="13" fill="#A5B4CC" font-weight="400" >Shift + Command + T: show or hide.</text><text x="365" y="147" font-size="13" fill="#A5B4CC" font-weight="400" >Shift + Command + L: click-through toggle.</text><text x="365" y="172" font-size="13" fill="#A5B4CC" font-weight="400" >Quit and workspace actions in the controls.</text><rect x="674" y="22" width="304" height="184" rx="12" fill="#090F1C" stroke="#233552"/><text x="691" y="52" font-size="10" fill="#60A5FA" font-weight="700" letter-spacing="1">MICROPHONE LIFECYCLE</text><text x="691" y="87" font-size="18" fill="#F8FAFC" font-weight="700" >Honest microphone status</text><text x="691" y="122" font-size="13" fill="#A5B4CC" font-weight="400" >Reading or an explicit mic test uses input.</text><text x="691" y="147" font-size="13" fill="#A5B4CC" font-weight="400" >Pause, stop or edit to release pacing input.</text><text x="691" y="172" font-size="13" fill="#A5B4CC" font-weight="400" >Recording audio is separately controlled.</text></g></svg>
