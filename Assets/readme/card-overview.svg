<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="228" viewBox="0 0 1000 228" role="img" aria-labelledby="title desc">
<title id="title">Read with no permissions / Move while you speak / Follow your place</title><desc id="desc">Telex for macOS. Electric cobalt, deep carbon and studio white.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090D16"/><stop offset="1" stop-color="#101B30"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#0066FF" stop-opacity=".32"/><stop offset="1" stop-color="#0066FF" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="1" fill="#60A5FA" opacity=".1"/></pattern>
</defs>
<rect width="1000" height="228" rx="18" fill="url(#bg)"/>
<ellipse cx="160" cy="20" rx="450" ry="240" fill="url(#glow)"/>
<rect width="1000" height="228" rx="18" fill="url(#grid)"/>
<rect x="1" y="1" width="998" height="226" rx="17" fill="none" stroke="#315080" stroke-opacity=".6"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="22" y="22" width="304" height="184" rx="12" fill="#090F1C" stroke="#233552"/><text x="39" y="52" font-size="10" fill="#60A5FA" font-weight="700" letter-spacing="1">01 / NO MICROPHONE</text><text x="39" y="87" font-size="18" fill="#F8FAFC" font-weight="700" >Read with no permissions</text><text x="39" y="122" font-size="13" fill="#A5B4CC" font-weight="400" >Continuous scrolling. Six speed presets.</text><text x="39" y="147" font-size="13" fill="#A5B4CC" font-weight="400" >40 / 80 / 130 / 180 / 240 / 300 WPM.</text><text x="39" y="172" font-size="13" fill="#A5B4CC" font-weight="400" >Choose a custom pace; pause or resume.</text><rect x="348" y="22" width="304" height="184" rx="12" fill="#090F1C" stroke="#233552"/><text x="365" y="52" font-size="10" fill="#60A5FA" font-weight="700" letter-spacing="1">02 / VOICE LEVEL</text><text x="365" y="87" font-size="18" fill="#F8FAFC" font-weight="700" >Move while you speak</text><text x="365" y="122" font-size="13" fill="#A5B4CC" font-weight="400" >Default pacing uses microphone input only.</text><text x="365" y="147" font-size="13" fill="#A5B4CC" font-weight="400" >Adjust sensitivity with the live input meter.</text><text x="365" y="172" font-size="13" fill="#A5B4CC" font-weight="400" >No Speech or Siri authorization required.</text><rect x="674" y="22" width="304" height="184" rx="12" fill="#090F1C" stroke="#233552"/><text x="691" y="52" font-size="10" fill="#60A5FA" font-weight="700" letter-spacing="1">03 / SCRIPT WORDS</text><text x="691" y="87" font-size="18" fill="#F8FAFC" font-weight="700" >Follow your place</text><text x="691" y="122" font-size="13" fill="#A5B4CC" font-weight="400" >Optional Apple on-device transcription.</text><text x="691" y="147" font-size="13" fill="#A5B4CC" font-weight="400" >Explicit permission and supported language.</text><text x="691" y="172" font-size="13" fill="#A5B4CC" font-weight="400" >Unavailable? Fall back to voice-level pacing.</text></g></svg>
