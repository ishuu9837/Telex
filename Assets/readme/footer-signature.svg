<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="108" viewBox="0 0 1000 108" role="img" aria-labelledby="title desc">
<title id="title">Telex for macOS — MIT licensed</title><desc id="desc">Telex for macOS. Electric cobalt, deep carbon and studio white.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090D16"/><stop offset="1" stop-color="#101B30"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#0066FF" stop-opacity=".32"/><stop offset="1" stop-color="#0066FF" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="1" fill="#60A5FA" opacity=".1"/></pattern>
</defs>
<rect width="1000" height="108" rx="18" fill="url(#bg)"/>
<ellipse cx="160" cy="20" rx="450" ry="240" fill="url(#glow)"/>
<rect width="1000" height="108" rx="18" fill="url(#grid)"/>
<rect x="1" y="1" width="998" height="106" rx="17" fill="none" stroke="#315080" stroke-opacity=".6"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="500" y="48" font-size="25" fill="#F8FAFC" font-weight="800" text-anchor="middle">Telex for macOS</text><text x="500" y="78" font-size="15" fill="#60A5FA" font-weight="400" text-anchor="middle">Built for a little more eye contact. MIT licensed.</text></g></svg>
